# GKE (Standard) manifests for the two-service ADK stack.
#
# DO NOT `kubectl apply` this file directly — the __PLACEHOLDER__ tokens are
# substituted from your .env by rebuild.sh, which keeps project-specific
# identifiers out of version control:
#
#   ./k8s/rebuild.sh                 # renders + applies
#   kubectl -n adk get pods -w       # watch
#   kubectl -n adk get svc webapp        # grab EXTERNAL-IP
#
# Both pods run as the KSA `adk-agents`, bound by Workload Identity to a Google
# service account that needs THREE roles:
#   roles/aiplatform.user        Gemini on Vertex (every agent)
#   roles/discoveryengine.viewer the Vertex AI Search datastore (financials_agent)
#   roles/documentai.apiUser     OCR for uploaded documents
# See docs/kubernetes.md.
---
apiVersion: v1
kind: Namespace
metadata:
  name: adk
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: adk-agents
  namespace: adk
  annotations:
    iam.gke.io/gcp-service-account: __GSA_EMAIL__
---
# ============================ formatter (internal) ============================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: formatter-agent
  namespace: adk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: formatter-agent
  template:
    metadata:
      labels:
        app: formatter-agent
    spec:
      serviceAccountName: adk-agents
      containers:
        - name: formatter-agent
          image: __IMAGE_BASE__/formatter-agent:__IMAGE_TAG__
          ports:
            - containerPort: 8080
          env:
            # Vertex config. These used to ride along in a .env baked into the
            # image; that file is no longer committed or copied in, so the
            # cluster must supply them explicitly.
            - name: GOOGLE_GENAI_USE_VERTEXAI
              value: "TRUE"
            - name: GOOGLE_CLOUD_PROJECT
              value: __PROJECT_ID__
            - name: GOOGLE_CLOUD_LOCATION
              value: __LOCATION__
            - name: ADK_MODEL
              value: __MODEL__
            # Baked INTO the agent card's advertised `url`
            # (rpc_url = "{protocol}://{host}:{port}/"). Point them at this
            # Service's in-cluster DNS so the coordinator can actually reach it.
            - name: A2A_HOST
              value: formatter-agent
            - name: A2A_PORT
              value: "8080"
            - name: A2A_PROTOCOL
              value: http
          readinessProbe:
            httpGet:
              path: /.well-known/agent-card.json
              port: 8080
            initialDelaySeconds: 10
          resources:
            # CPU request is a scheduling RESERVATION, not a usage cap. e2-medium
            # exposes only ~940m allocatable and GKE system pods already reserve
            # most of it, so these are sized tiny to fit a single node. No CPU
            # limit, so the near-idle app still bursts on the node's free vCPU.
            requests:
              cpu: "20m"
              memory: "256Mi"
            limits:
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: formatter-agent
  namespace: adk
spec:
  # ClusterIP (default) — internal only. Resolves as http://formatter-agent:8080
  # from other pods in this namespace.
  selector:
    app: formatter-agent
  ports:
    - port: 8080
      targetPort: 8080
---
# ============================= web app (public) ==============================
# This image contains the coordinator package as well — the web app drives the
# agent through an ADK Runner in-process, so there is no separate coordinator
# workload. The only network hop between agents is the A2A call to the
# formatter Service above, which is exactly the boundary worth having.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  namespace: adk
spec:
  # Single replica on purpose: conversation state AND uploaded documents are
  # held in the serving process, so a second replica would split sessions and
  # make an upload invisible to the next request.
  replicas: 1
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      serviceAccountName: adk-agents
      containers:
        - name: webapp
          image: __IMAGE_BASE__/webapp:__IMAGE_TAG__
          ports:
            - containerPort: 8080
          env:
            - name: GOOGLE_GENAI_USE_VERTEXAI
              value: "TRUE"
            - name: GOOGLE_CLOUD_PROJECT
              value: __PROJECT_ID__
            - name: GOOGLE_CLOUD_LOCATION
              value: __LOCATION__
            - name: ADK_MODEL
              value: __MODEL__
            # Both the card-fetch host AND the card's advertised url must be
            # this in-cluster Service (see the formatter's A2A_* above).
            - name: FORMATTER_A2A_URL
              value: http://formatter-agent:8080/.well-known/agent-card.json
            # Optional indexed-filings lane. Empty disables it cleanly.
            - name: VERTEX_SEARCH_DATASTORE
              value: "__DATASTORE__"
            - name: ENABLE_DATASTORE
              value: auto
            # Document AI, for the uploaded-document lane.
            - name: DOCAI_LOCATION
              value: __DOCAI_LOCATION__
            - name: DOCAI_PROCESSOR_ID
              value: "__DOCAI_PROCESSOR_ID__"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            # Startup probes the formatter card and the datastore before the
            # app reports ready, so give it room.
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: "40m"
              memory: "512Mi"
            limits:
              # Uploaded documents and their indexes live in this process.
              memory: "1.5Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: webapp
  namespace: adk
spec:
  type: LoadBalancer          # GKE provisions a public IP
  selector:
    app: webapp
  ports:
    - port: 80
      targetPort: 8080
